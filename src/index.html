<title>Treino TalTech — GRE + TOEFL</title>
<style>

 --hdr:#0a0e15;--hdr-ink:#f1f4f9;--hdr-mut:#8b98ad;--nav-ink:#c3cde0;--nav-hover:#1b2536;--nav-on:#e6ebf3;--nav-on-ink:#0a0e15;
 --prompt:#131a25;--track:#2a3547;--timer:#0a0e15;--timer-ink:#f1f4f9;--timer-low:#c23b3b;--overlay:rgba(0,0,0,.6);--toast:#2a3547;--shadow:none}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--hdr);color:var(--hdr-ink);padding:10px 18px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;white-space:nowrap}
#ver{font-weight:400;font-size:12px;color:var(--hdr-mut);cursor:pointer}
nav{display:flex;gap:2px;flex:none}
nav button,#gear{background:transparent;color:var(--nav-ink);border:0;padding:7px 12px;border-radius:7px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on,#gear.on{background:var(--nav-on);color:var(--nav-on-ink);font-weight:600}
nav button:hover:not(.on),#gear:hover:not(.on){background:var(--nav-hover)}
#gear{padding:6px 8px;display:flex;align-items:center}
#gear svg{width:20px;height:20px}
#savest{margin-left:auto;font-size:12px;color:var(--hdr-mut);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
#gear{flex:none}
@media(max-width:900px){header{gap:10px;padding:10px 12px}nav button{padding:7px 9px}}
main{max-width:1000px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
h2{font-size:19px;line-height:1.3;margin:0 0 12px}h3{font-size:16px;line-height:1.3;margin:16px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut);font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:8px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-ink)}
.btn.dangerline{color:var(--bad);border-color:var(--bad)}
.btn.on{background:var(--pri2);border-color:var(--acc);color:var(--acc);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mut)}.btn.ghost:hover{border-color:var(--line);color:var(--ink)}
.btn.acc{border-color:var(--acc);color:var(--acc);font-weight:600}
.btn.ic{display:inline-flex;align-items:center;gap:7px}.btn.ic svg{width:16px;height:16px;flex:none}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 12px;line-height:1.4}
.opt.sel{background:var(--pri2);border-color:var(--acc)}
.opt.ok{background:var(--okb);border-color:var(--ok)}
.opt.bad{background:var(--badb);border-color:var(--bad)}
.q{font-size:17px;line-height:1.45;margin:0 0 14px}
.qkind{font-size:13px;font-weight:600;color:var(--acc);margin-bottom:4px}
.qtext{margin:0}.qtext b.w{font-weight:700}
.qmeta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut);margin:-4px 0 14px;min-height:28px}
.qmeta .qn{white-space:nowrap;font-weight:600;color:var(--ink)}.qmeta .qscore{white-space:nowrap}.qmeta .btn{white-space:nowrap;margin-right:-8px}.qmeta .pill{flex:none;white-space:nowrap}
.qprog{flex:1;height:4px;background:var(--track);border-radius:99px;overflow:hidden;min-width:48px}.qprog i{display:block;height:100%;background:var(--acc);border-radius:99px}
.wunit{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;margin-top:12px;padding:2px 0 2px 12px;border-left:3px solid var(--acc)}
.wunit .wbig{font-size:28px;line-height:1.2;font-weight:650;letter-spacing:-.01em}.wunit .ipa{font-size:16px}
.aud{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);vertical-align:middle;flex:none}
.aud .spk{border:0;border-radius:0;margin:0;padding:4px 7px}.aud .spk+.spk{border-left:1px solid var(--line)}.aud .spk.slow{font-size:12px;padding:4px 8px}
.wunit .aud .spk{padding:6px 10px}.wunit .aud .spk svg{width:18px;height:18px}.wunit .aud .spk.slow{font-size:13px}
.fb{border-radius:8px;padding:12px;margin-top:12px;line-height:1.5}.fb>div+div{margin-top:6px}.fbh{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}.fb .lbl{font-size:13px;opacity:.85;margin-bottom:4px}
.fb.ok{background:var(--okb);color:var(--ok-ink)}.fb.bad{background:var(--badb);color:var(--bad-ink)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--pri2);color:var(--acc);font-size:12px;font-weight:600;line-height:1.5}
textarea{width:100%;min-height:300px;font:15px/1.55 "Segoe UI",system-ui,sans-serif;padding:10px;border:1px solid var(--line);border-radius:8px;resize:vertical;background:var(--field);color:var(--ink)}
input[type=text],select{font:inherit;padding:6px 9px;max-width:100%;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.timer{font:600 26px/1 Consolas,monospace;padding:6px 12px;border-radius:8px;background:var(--timer);color:var(--timer-ink);border:1px solid var(--line);min-width:96px;text-align:center}
.timer.low{background:var(--timer-low);color:#fff}
.prompt{background:var(--prompt);border-left:4px solid var(--acc);padding:10px 13px;border-radius:6px;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:13px;white-space:nowrap;vertical-align:bottom}
td.nw{white-space:nowrap}table.mid td{vertical-align:middle}table.rub td:first-child{width:28px}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--acc)}
.chips .btn{margin:3px}
.built{min-height:44px;border:2px dashed var(--line);border-radius:8px;padding:8px;margin:8px 0;font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.ms{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.ms input{margin-top:4px;width:18px;height:18px;accent-color:var(--pri)}
.ms.done span.t{color:var(--mut);text-decoration:line-through}
#modal{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;z-index:20}
#modal .card{width:min(820px,92vw);max-height:86vh;overflow:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--toast);color:#fff;padding:9px 16px;border-radius:9px;z-index:30;max-width:90vw}
.big{font-size:22px;font-weight:600}
.score{font-size:32px;font-weight:650;line-height:1.2;margin:0 0 12px}
.empty{text-align:center;padding:28px 18px}.empty p{margin:0 0 6px}.empty .btn{margin-top:8px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}.mhead h2{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mhead .btn{flex:none}
.tasks{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center}.tasks .tg{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tasks .grp{font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.04em}.tasks .btn .mut{font-size:12px;margin-left:4px}.tasks .btn.on .mut{color:inherit;opacity:.8}
.pn{display:flex;gap:8px;margin-left:auto}.selrow{display:flex;gap:8px;align-items:center}.selrow select{flex:1;min-width:0}.selrow>*{flex:none}.selrow>select{flex:1 1 auto}
.optgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 12px;margin-top:4px}.optgrid .wb{flex-wrap:nowrap;white-space:nowrap}
ul.r{margin:4px 0 0 18px;padding:0}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg .btn{display:flex;align-items:center;gap:9px;padding:8px 14px}
.sw{width:30px;height:20px;border-radius:5px;border:1px solid #8892a3;display:inline-block;flex:none}
.sw.light{background:linear-gradient(#14213d 0 30%,#f4f6fa 30%)}
.sw.dark{background:linear-gradient(#0a0e15 0 30%,#18202d 30%)}
.sw.system{background:linear-gradient(135deg,#f4f6fa 0 50%,#18202d 50%)}
.kv{display:grid;grid-template-columns:minmax(130px,auto) 1fr;gap:6px 16px;font-size:14px}
.kv>span:nth-child(odd){color:var(--mut);white-space:nowrap}
.spk{display:inline-flex;align-items:center;justify-content:center;gap:3px;border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:7px;padding:3px 6px;margin-left:6px;cursor:pointer;vertical-align:middle;font:inherit;font-size:11px;line-height:1}.spk:hover{background:var(--pri2)}.spk:focus-visible{outline:2px solid var(--pri);outline-offset:1px}.spk.slow{color:var(--mut)}.chip .spk{border:0;background:transparent;color:inherit;padding:0 0 0 2px;margin-left:2px}.chip .spk svg{width:12px;height:12px}.wb{display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px 8px;vertical-align:middle;line-height:1.3}.wb>.spk,.wb>.aud{margin-left:0}.wbw{display:inline-flex;align-items:center}.ipa{font-family:"Segoe UI","Noto Sans","Charis SIL","Lucida Sans Unicode",sans-serif;font-size:13px;color:var(--mut);font-weight:400}.sayrow{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}.sayrow .spk,.sayrow .aud{margin-left:0}.optw{padding:4px 8px;border-radius:7px;border:1px solid transparent}.optw.ok{border-color:var(--ok)}.missed{margin:8px 0}.warnline{color:var(--bad-ink)}
.chip{display:inline-block;padding:1px 8px;margin:2px 3px 2px 0;border-radius:99px;background:var(--badb);color:var(--bad-ink);border:1px solid var(--bad);font-size:12px}
.slist{border-top:1px solid var(--line)}
.srow{display:grid;grid-template-columns:minmax(142px,1fr) minmax(124px,.8fr) minmax(124px,.8fr) minmax(96px,1.6fr) auto;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}.srow .sact{align-self:center}
.srow>*{min-width:0}
.sname .snm{font-weight:650;font-size:14px;line-height:1.35}.sname .srng,.sname .sseen{font-size:12px;line-height:1.4;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sname .seen{color:var(--ink);font-weight:600}
.slbl{font-size:12px;line-height:1.35;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.sval{font-size:14px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}.sval.mut{font-size:13px}
.sbar{height:4px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:6px;max-width:140px}.sbar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.pend{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;overflow:hidden;min-height:22px;padding-top:1px}.pend.open{flex-wrap:wrap}
.pend .chip{margin:0;white-space:nowrap;flex:none;line-height:1.5}.pend .chip.hid{display:none}
.pend .more{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:99px;font:inherit;font-size:12px;line-height:1.5;padding:1px 8px;cursor:pointer;white-space:nowrap}.pend .more:hover{color:var(--ink);background:var(--pri2)}.pend .more:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.sact .btn{white-space:nowrap}
#settable .legend{margin-top:12px}
.path{font-family:Consolas,monospace;font-size:13px;word-break:break-all}
.dz{border:1px solid var(--bad);border-radius:10px;padding:12px 14px;margin-top:14px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dz b,.danger-t{color:var(--bad)}
.resume{border-color:var(--acc);background:var(--pri2)}.resume .rt{line-height:1.45}.resume .row{margin-top:10px}.dot{color:var(--acc);font-weight:700}.btn.on .dot{color:inherit}
</style>
</head>

</header>

  2: o => { // v1.1 -> schema 3 (v1.2): configurações dentro do progresso.json

    let cls = ""; if (R.done) { if (o === q.answer) cls = "ok"; else if (R.picked.includes(o)) cls = "bad"; } else if (R.picked.includes(o)) cls = "sel";
    h += `<button class="btn opt ${cls}" data-act="qpick" data-v="${k}" ${R.done ? "disabled" : ""}><span class="mut">${k + 1}.</span> ${esc(o)}</button>`;
  });
  if (q.type !== "NE" && !R.done) h += confirmBar("qconfirm", R.picked.length === 1, L("Confirmar", "Confirm"));
  if (R.done) h += `<div class="fb ${R.lastOk ? "ok" : "bad"}"><b>${rightWrong(R.lastOk)}</b> ${ansLbl()}: <b>${esc(q.answer)}</b>. ${esc(L(q.solution, q.solutionEn || q.solution))}</div><div class="row" style="margin-top:10px"><button class="btn pri" data-act="next">${L("Próxima →", "Next →")}</button></div>`;
  h += `</div>`;
  const st = statsFor("quant", x => (DATA.quant.find(q => q.id === x.id) || {}).type);
  h += `<div class="card"><h3 style="margin-top:0">${L("Desempenho por tipo (acumulado)", "Performance by type (all time)")}</h3><table class="mid"><tr><th>${L("Tipo", "Type")}</th><th>${L("Acertos", "Correct")}</th><th style="width:40%"></th></tr>` +
    ["QC","MC","NE"].map(t => { const a = st[t] || {ok:0,n:0}; return `<tr><td>${QT()[t]}</td><td class="nw">${a.ok}/${a.n} (${pct(a.ok,a.n)}%)</td><td>${bar(pct(a.ok,a.n))}</td></tr>`; }).join("") + `</table></div>`;
  return h;
}
function quantCheck(val) {
  const q = R.cur.item; let ok;
  if (q.type === "NE") { R.neVal = val; const ne = s => String(s).trim().toLowerCase().replace(/\s+/g, "").replace(/,/g, "."); const num = s => { const m = s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/); return m ? +m[1] / +m[2] : (s === "" ? NaN : +s); };
    const v = ne(val); ok = (q.accept || [q.answer]).some(a => ne(a) === v || (!isNaN(num(v)) && Math.abs(num(v) - num(ne(a))) < 1e-9)); R.picked = [val]; }
  else { R.picked = [val]; ok = val === q.answer; }
  R.done = true; R.lastOk = ok; R.n++; if (ok) R.ok++; R.ask = false;
  logAnswer("quant", q.id, q.type, ok); render();
}

  switch (a) {
    case "tab": go(v); break;
    case "say": if (LP && LP.fired && LP.b === el) { LP = null; break; } LP = null; sayEn(v, RATE_NORMAL); break;
    case "sayslow": sayEn(v, RATE_SLOW); break;
    case "autospeak": P.settings.autoSpeak = v === "on"; persist(true); render(); toast(P.settings.autoSpeak ? L("Pronúncia automática ligada.", "Auto pronunciation on.") : L("Pronúncia automática desligada.", "Auto pronunciation off.")); break;
    case "saytest": sayEn("The storm finally began to abate after midnight.", RATE_NORMAL); break;
    case "again": if (TAB === "vocab") startVocab(); else startQuant(); persist(true); render(); break;
    case "rcont": if (R) R.ask = false; render(); break;
    case "rnew": if (R && R.n > 0 && R.cur && !confirm(L(`Começar uma nova sessão? A atual (${R.n}/${R.queue.length} respondidas) vai para "Últimas rodadas"; as respostas já confirmadas continuam contando.`, `Start a new session? The current one (${R.n}/${R.queue.length} answered) goes to "Recent rounds"; answers already confirmed still count.`))) break;
    // fallthrough
    case "rnewnow": if (TAB === "vocab") startVocab(); else if (TAB === "quant") startQuant(); persist(true); render(); window.scrollTo(0, 0); break;
    case "next": nextQ(); break;
    case "vmode": setVMode(v); useVocab(); persist(true); render(); break;
    case "vset": V.set = V.sets[V.mode] = +v; useVocab(); persist(true); render(); break;
    case "pmore": { const n = +v; SETS_OPEN.has(n) ? SETS_OPEN.delete(n) : SETS_OPEN.add(n); render(); break; }
    case "vtrain": if (V.mode === "revisao") setVMode("def"); V.set = V.sets[V.mode] = +v; useVocab(); persist(true); render(); window.scrollTo(0, 0); break;
    case "vpick": { if (R.done) break; const o = R.cur.options[+v]; if (R.cur.need === 1) R.picked = R.picked[0] === o ? [] : [o]; else R.picked = R.picked.includes(o) ? R.picked.filter(x => x !== o) : R.picked.length < R.cur.need ? R.picked.concat(o) : R.picked; render(); break; }
    case "vconfirm": if (!R.done && R.picked.length === R.cur.need) vocabCheck(); break;
    case "qtype": Q.type = v; useQuant(); persist(true); render(); break;
    case "qpick": { if (R.done) break; const o = R.cur.options[+v]; R.picked = R.picked[0] === o ? [] : [o]; render(); break; }
    case "qconfirm": if (!R.done && R.picked.length === 1) quantCheck(R.picked[0]); break;
    case "qne": { const val = $("#neans") ? $("#neans").value : ""; if (!R.done && val.trim()) quantCheck(val); break; }
    case "wtask": T.stop(); T.total = 0; W.task = v; W.idx = 0; render(); break;
    case "wrand": T.stop(); T.total = 0; W.idx = Math.floor(Math.random() * wList().length); render(); break;
    case "wstart": T.start(wMinutes() * 60, () => toast(L("Tempo esgotado! Termine a frase e salve.", "Time's up! Finish your sentence and save."))); $("#essay").focus(); render(); $("#essay").focus(); break;
    case "tstop": if (T.running()) { T.stop(); T.paused = T.left; toast(L("Timer pausado.", "Timer paused.")); } else if (T.total && T.left > 0) { const left = T.left, tot = T.total; T.start(left, T.onEnd); T.total = tot; T.t0 = Date.now() - (tot - left) * 1000; } break;
    case "wsave": saveEssay(); break;
    case "wclear": if (confirm(L("Apagar o texto atual do rascunho?", "Delete the current draft text?"))) { delete P.rascunhos[wKey()]; persist(); render(); } break;
    case "eview": showEssay(v); break;
    case "ecopy": { const r = P.redacoes.find(x => x.id === v); if (r) { await API.copy(r.texto); toast(L("Redação copiada.", "Essay copied.")); } break; }
    case "edel": if (confirm(L("Apagar esta redação do seu histórico?", "Delete this essay from your history?"))) { P.redacoes = P.redacoes.filter(x => x.id !== v); persist(true); render(); } break;
    case "mclose": case "newsok": closeModal(); break;
    case "bchip": B.built.push(+v); persist(); render(); break;
    case "bundo": B.built.pop(); persist(); render(); break;
    case "bclear": B.built = []; persist(); render(); break;
    case "bcheck": if (!B.done && B.built.length) buildCheck(); break;
    case "bremove": if (!B.done) { B.built.splice(+v, 1); persist(); render(); } break;
    case "novidades": showNews(true); break;
    case "bnext": B.idx = (B.idx + 1) % DATA.toeflWriting.buildSentence.practice.length; B.built = []; B.done = false; persist(); render(); break;
    case "stask": T.stop(); S.task = v; S.set = 0; S.i = 0; render(); break;
    case "sset": T.stop(); S.set = +v; S.i = 0; render(); break;
    case "sprev": T.stop(); S.i--; render(); break;
    case "snext": T.stop(); S.i++; render(); break;
    case "ssay": if (!speak(spCur())) toast(L("Sem voz disponível — leia o texto.", "No voice available — read the text.")); break;
    case "sgo": T.start(spSecs()); break;
    case "sauto": {
      const txt = spCur(); let started = false; const startT = () => { if (!started) { started = true; T.start(spSecs()); } };
      if (window.speechSynthesis && speak(txt)) { const u = setInterval(() => { if (!speechSynthesis.speaking) { clearInterval(u); startT(); } }, 150); setTimeout(() => { clearInterval(u); startT(); }, 15000); }
      else startT(); break; }
    case "slog": P.falas.push({ t: now(), tarefa: S.task, cenario: S.set, nota: $("#sscore").value }); persist(true); toast(L("Sessão registrada.", "Session logged.")); render(); break;
    case "export": { const t = exportText(); const ta = $("#exptxt"); ta.style.display = "block"; ta.value = t;
      try { await API.copy(t); toast(L("Resumo copiado! Cole no chat (Ctrl+V).", "Summary copied! Paste it in the chat (Ctrl+V).")); } catch (e) { ta.select(); toast(L("Não consegui copiar automaticamente — selecione o texto abaixo e use Ctrl+C.", "Could not copy automatically — select the text below and press Ctrl+C.")); } break; }
    case "folder": await API.openFolder(); break;
    case "wok": if (P.erros[v]) { P.erros[v].pendente = false; P.erros[v].revisada = now(); persist(); render(); } break;
    case "toreview": setVMode("revisao"); go("vocab"); break;
    case "theme": if (["light", "dark", "system"].includes(v)) { P.settings.theme = v; applyTheme(); persist(true); render(); } break;
    case "lang": if (v === "pt" || v === "en") { P.settings.language = v; applyLang(); persist(true); render(); } break;
    case "bexport": await doExport(); break;
    case "bimport": await doImport(); break;
    case "iconfirm": await confirmImport(); break;
    case "breset": askReset(); break;
    case "rconfirm": await confirmReset(); break;
  }
  } catch (e) { toast(L("Erro: ", "Error: ") + (e && e.message || e)); }
});
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
window.addEventListener("beforeunload", () => { if (saveTimer) persist(true); }); // sessões em andamento ficam salvas (não fecha a rodada)

applyTheme(); // tema do sistema já antes de carregar (evita piscar)
(async function init() {
  if (!DATA) { $("#app").innerHTML = '<div class="card">Dados não encontrados.</div>'; return; }
  await loadP(); applyTheme(); applyLang(); $("#ver").textContent = "v" + APP_VERSION; render();
  if (LOADINFO.newer) toast(L("Este progresso foi salvo por uma versão mais nova do app; nada será apagado.", "This progress was saved by a newer app version; nothing will be deleted."));
  showNews(false);
  if (!LOADINFO.migrated) setSaveStatus(API.native() ? L("progresso salvo localmente", "progress saved locally") : L("modo navegador (localStorage)", "browser mode (localStorage)"));
  window.__ready = true;
})();
</script>
