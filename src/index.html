/* ---------- idioma da interface ---------- */
const LANG = () => (P && P.settings && P.settings.language === "en") ? "en" : "pt";
const L = (pt, en) => LANG() === "en" ? en : pt;
const LOC = () => LANG() === "en" ? "en-GB" : "pt-BR";

/* ---------- ponte com o Go (com fallback para navegador comum) ---------- */
const has = n => typeof window[n] === "function";
const API = {
  native: () => has("goSaveProgress"),
  async load() { if (this.native()) return await window.goLoadProgress(); try { return localStorage.getItem("treinoTalTech") || ""; } catch (e) { return ""; } },
  async save(s) { if (this.native()) return await window.goSaveProgress(s); try { localStorage.setItem("treinoTalTech", s); } catch (e) {} },
  async copy(t) {
    if (has("goCopyText")) return await window.goCopyText(t);
    if (navigator.clipboard) return await navigator.clipboard.writeText(t);
    throw new Error(L("Área de transferência indisponível", "Clipboard unavailable"));
  },
  async openFolder() { if (has("goOpenDataFolder")) return await window.goOpenDataFolder(); throw new Error(L("Só no app para Windows", "Windows app only")); },
  async backup(oldSchema) {
    if (has("goBackupProgress")) return await window.goBackupProgress(oldSchema);
    try { localStorage.setItem("treinoTalTech-v" + oldSchema + ".bak", localStorage.getItem("treinoTalTech") || ""); } catch (e) {} return "localStorage";
  },
  async backupNamed(tag) { // cópia de segurança do arquivo atual antes de importar/zerar
    if (has("goBackupNamed")) return await window.goBackupNamed(tag);
    const k = "treinoTalTech-" + tag + ".bak"; localStorage.setItem(k, localStorage.getItem("treinoTalTech") || ""); return k;
  },
  async folder() { if (has("goDataFolder")) return await window.goDataFolder(); return L("(navegador: localStorage)", "(browser: localStorage)"); },
  async info() {
    if (has("goDataInfo")) return await window.goDataInfo();
    const s = (() => { try { return localStorage.getItem("treinoTalTech") || ""; } catch (e) { return ""; } })();
    return { folder: "localStorage", file: "treinoTalTech", size: new Blob([s]).size, modified: "", exists: !!s };
  },

  else { R.picked = [val]; ok = val === q.answer; }
  R.done = true; R.lastOk = ok; R.n++; if (ok) R.ok++; R.ask = false;
  logAnswer("quant", q.id, q.type, ok); render();
}

/* ---------- SIMULADOS ----------
   O conteúdo vem de pacotes importados (tipo "simulados"/"ets", fora do GitHub) e chega por goEtsData/goEtsAudio.
   Sem pacote, a aba mostra "Nenhum conteúdo de simulado instalado".
   Tempo: a ETS publica só o tempo de cada seção do teste real (Reading 30 min / 50 itens, Listening 29 min / 47 itens,
   Writing 23 min: Email 7 + Discussão 10, Speaking ~8 min). Estes simulados têm menos itens, então cada módulo usa o
   mesmo ritmo por item do teste real (Reading 36 s/item, Listening ~37 s/item); Build a Sentence = 23 − 17 = 6 min. */
let ETS = null, ETS_STATE = "loading";
async function loadEts() {
  try { const s = await API.etsData(); if (s) { const o = JSON.parse(s); if (o && Array.isArray(o.tests) && o.tests.length) { ETS = o; ETS_STATE = "ok"; return; } } } catch (e) {}
  ETS = null; ETS_STATE = "none";
}
const URLS = { toeflReg: "https://www.ets.org/toefl/test-takers/ibt/register.html", toeflScores: "https://www.ets.org/toefl/test-takers/ibt/scores/get-scores.html",
  powerprep: "https://www.ets.org/gre/test-takers/general-test/prepare/powerprep.html", greReg: "https://www.ets.org/gre/test-takers/general-test/register.html",
  greSend: "https://www.ets.org/gre/test-takers/general-test/scores/send-scores.html" };
const SIM_ORDER = ["flpt1", "tpt1", "tpt2", "tpt3", "flpt2", "tpt4", "tpt5"]; // ordem do plano de estudos
const simTest = id => ETS && ETS.tests.find(t => t.id === id) || null;
// nomes genéricos (v1.6.1): "Simulado N" pela ordem do plano; o título de verdade vem do pacote importado
const simNum = id => SIM_ORDER.indexOf(id) + 1;
const simAbbr = id => simNum(id) ? L("Simulado ", "Practice test ") + simNum(id) : String(id);
const simName = id => { const t = simTest(id); return t && t.title || simAbbr(id); };
const SECS = ["reading", "listening", "writing", "speaking"];
const SEC_NAME = { reading: "Reading", listening: "Listening", writing: "Writing", speaking: "Speaking" };
const STEPS = { reading: ["R1", "R2"], listening: ["L1", "L2"], writing: ["WB", "WE", "WD"], speaking: ["SR", "SI"] };
const stepSec = s => ({ R: "reading", L: "listening", W: "writing", S: "speaking" })[s[0]];
const stepTimed = s => s[0] !== "S";
const stepLbl = s => ({ R1: L("Módulo 1", "Module 1"), R2: L("Módulo 2", "Module 2"), L1: L("Módulo 1", "Module 1"), L2: L("Módulo 2", "Module 2"), WB: "Build a Sentence", WE: "Write an Email", WD: "Academic Discussion", SR: "Listen and Repeat", SI: "Take an Interview" })[s];
// itens (1..N) que a tela `page` de Reading/Listening mostra: [primeiro, último]; tela em grupo = faixa
function simRange(t, s, page) {
  if (s[0] === "R") { const m = t.reading[+s[1] - 1], pg = rPages(m)[page], nCtw = m.ctw.filter(x => typeof x === "object").length; if (!pg) return [0, 0];
    if (pg.k === "ctw") return [1, nCtw];
    const a = nCtw + m.groups.slice(0, pg.gi).reduce((x, g) => x + g.qs.length, 0) + pg.g.qs.indexOf(pg.q) + 1; return [a, a]; }
  const mod = t.listening[+s[1] - 1]; if (!mod[page]) return [0, 0];
  const a = mod.slice(0, page).reduce((x, g) => x + g.qs.length, 0) + 1; return [a, a + mod[page].qs.length - 1];
}
function simItems(t, s) { // itens pontuados de cada etapa
  if (s[0] === "R") { const m = t.reading[+s[1] - 1]; return m.ctw.filter(x => typeof x === "object").length + m.groups.reduce((a, g) => a + g.qs.length, 0); }
  if (s[0] === "L") return t.listening[+s[1] - 1].reduce((a, g) => a + g.qs.length, 0);
  if (s === "WB") return t.writing.build.length;
  if (s === "SR") return t.speaking.repeat.items.length;
  if (s === "SI") return t.speaking.interview.items.length;
  return 1;
}
function stepSecs(t, s) {
  if (s[0] === "R") return Math.round(simItems(t, s) * 1800 / 50);
  if (s[0] === "L") return Math.round(simItems(t, s) * 1740 / 47);
  return { WB: 360, WE: 420, WD: 600 }[s] || 0;
}
function spStepSecs(t, s) { // duração aproximada de uma tarefa de Speaking: áudios oficiais + tempos de resposta
  const d = t.audioDur || {}, pre = s === "SR" ? "S_r" : "S_i"; let n = 0; Object.keys(d).filter(k => k.indexOf(pre) === 0).forEach(k => n += d[k]);
  if (s === "SR") t.speaking.repeat.items.forEach(x => n += lrSeconds(x.replace(/^\w+:\s*/, ""))); else n += t.speaking.interview.items.length * DATA.toeflSpeaking.interview.responseSeconds;
  return Math.round(n);
}
// durações em listas: total em minutos primeiro ("24 min"); "~" quando o arredondamento esconde segundos; mm:ss só nos cronômetros e no tempo restante
function durMin(secs) { secs = Math.round(secs); return secs < 60 ? `${secs} s` : (secs % 60 ? "~" : "") + Math.round(secs / 60) + " min"; }
function secSecs(t, sec) { return sec === "speaking" ? spStepSecs(t, "SR") + spStepSecs(t, "SI") : STEPS[sec].reduce((a, s) => a + stepSecs(t, s), 0); }
function secDur(t, sec) { // "24 min (12 + 12)", "~21 min (11 + 10)", "~7 min (11 itens)"
  if (sec === "speaking") { const n = simItems(t, "SR") + simItems(t, "SI"); return `~${Math.max(1, Math.round(secSecs(t, sec) / 60))} min (${n} ${L("itens", "items")})`; }
  const st = STEPS[sec].map(s => stepSecs(t, s));

    case "sgo": spRecCancel(); T.start(spSecs(), () => spRecStop()); await spRecStart(spSecs()); render(); break;
    case "sauto": {
      const txt = spCur(); let started = false; const startT = () => { if (!started) { started = true; T.start(spSecs(), () => spRecStop()); spRecStart(spSecs()).then(() => { if (TAB === "speaking") render(); }); } };
      if (window.speechSynthesis && speak(txt)) { const u = setInterval(() => { if (!speechSynthesis.speaking) { clearInterval(u); startT(); } }, 150); setTimeout(() => { clearInterval(u); startT(); }, 15000); }
      else startT(); break; }
    case "slog": { const F = P.falaAtual, nota = $("#sscore").value;
      if (F && F.tarefa === S.task && F.cenario === S.set) { F.nota = nota; P.falas.push(F); P.falaAtual = null; } else P.falas.push({ id: "f" + Date.now(), t: now(), tarefa: S.task, cenario: S.set, nota }); }
      persist(true); toast(L("Sessão registrada.", "Session logged.")); render(); break;
    case "export": { const t = exportText(); const ta = $("#exptxt"); ta.style.display = "block"; ta.value = t;
      try { await API.copy(t); toast(L("Resumo copiado! Cole no chat (Ctrl+V).", "Summary copied! Paste it in the chat (Ctrl+V).")); } catch (e) { ta.select(); toast(L("Não consegui copiar automaticamente; selecione o texto abaixo e use Ctrl+C.", "Could not copy automatically; select the text below and press Ctrl+C.")); } break; }
    case "folder": try { await API.openFolder(); } catch (e) { toast(errText(e)); } break;
    case "wok": if (P.erros[v]) { P.erros[v].pendente = false; P.erros[v].revisada = now(); persist(); render(); } break;
    case "toreview": setVMode("revisao"); go("vocab"); break;
    case "theme": if (["light", "dark", "system"].includes(v)) { P.settings.theme = v; applyTheme(); persist(true); render(); } break;
    case "lang": if (v === "pt" || v === "en") { P.settings.language = v; applyLang(); persist(true); render(); } break;
    case "bexport": await doExport(); break;
    case "bimport": await doImport(); break;
    case "iconfirm": await confirmImport(); break;
    case "breset": askReset(); break;
    case "rconfirm": await confirmReset(); break;
    /* simulados */
    case "simurl": ev.preventDefault(); await API.openURL(v); break;
    case "simopen": ev.preventDefault(); if (SIM_AUDIO.playing && String(SIM_AUDIO.playing).startsWith("rv:")) simStopAudio(); SIM.view = v; if (TAB !== "sim") go("sim"); else { render(); window.scrollTo(0, 0); } break;
    case "simlist": SIM.view = null; render(); window.scrollTo(0, 0); break;
    case "simgo": simStart(SIM.view, v); break;
    case "volplay": { const A = simA(); if (A) volPlay(A.test); break; }
    case "volgo": { const A = simA(); if (!A) break; simStopAudio(); SIM.volOK = A.id + ":" + A.si; render(); window.scrollTo(0, 0); break; }
    case "simresume": SIM.view = "run"; SIM.volOK = null; render(); window.scrollTo(0, 0); break;
    case "simrec": SIM.view = { rec: v }; render(); window.scrollTo(0, 0); break;
    case "simrv": simStopAudio(); SIM.view = { rv: v, sec: el.dataset.s || "", wrong: false }; if (TAB !== "sim") go("sim"); else { render(); window.scrollTo(0, 0); } break;
    case "simrvsec": if (SIM.view && SIM.view.rv) { simStopAudio(); SIM.view.sec = v; render(); window.scrollTo(0, 0); } break;
    case "simrvf": if (SIM.view && SIM.view.rv) { SIM.view.wrong = v === "wrong"; render(); } break;
    case "simrvplay": rvPlay(el); break;
    case "simdiscard": if (await appConfirm({ title: L("Descartar o simulado em andamento?", "Discard the practice test in progress?"), body: cfP(L("As respostas dele não serão salvas, e as gravações dele serão apagadas.", "Its answers will not be saved, and its recordings will be deleted.")), ok: L("Descartar", "Discard"), cancel: L("Voltar", "Go back"), danger: true })) { simLeave(); T.stop(); T.total = 0; recDeleteAll(P.simuladoAtual); P.simuladoAtual = null; persist(true); render(); } break;
    case "simexit": simLeave(); T.stop(); T.total = 0; SIM.view = null; persist(true); render(); toast(L("Simulado salvo; continue quando quiser.", "Practice test saved; continue any time.")); break;
    case "simbegin": simBegin(); break;
    case "simpage": case "simprev": case "simnext": { const A = simA(); if (!A) break; A.page = a === "simpage" ? +v : A.page + (a === "simprev" ? -1 : 1); if (A.page < 0) A.page = 0; persist(); render(); window.scrollTo(0, 0); break; }
    case "simend": { const A = simA(); if (!A) break; const s = A.steps[A.si], si0 = A.si, t = simTest(A.test); let mc = 0, mq = 0;
      if (s[0] === "R") { const m = t.reading[+s[1] - 1], an = A.ans[s] || {}; m.ctw.forEach(x => { if (typeof x === "object" && !String((an.ctw || {})[x.n] || "").trim()) mc++; }); m.groups.forEach(g => g.qs.forEach(q => { if ((an.q || {})[q.n] == null) mq++; })); }
      if (s === "WB") mq = t.writing.build.filter(b => !(A.bas[b.n] || []).length).length;
      if (s[0] === "R" || s[0] === "W") {
        const mod = s[0] === "R", nq = s === "WB" ? [L("frase", "sentence"), L("frases", "sentences")] : [L("questão", "question"), L("questões", "questions")];
        const parts = []; if (mc) parts.push(mc + " " + (mc === 1 ? L("lacuna", "blank") : L("lacunas", "blanks"))); if (mq) parts.push(mq + " " + nq[mq === 1 ? 0 : 1]);
        const miss = parts.length ? `<p><b>${esc(parts.join(L(" e ", " and ")) + " " + L("sem resposta", "unanswered"))}</b></p>` : "";
        const go = await appConfirm({ title: mod ? L("Encerrar módulo?", "End this module?") : L("Encerrar tarefa?", "End this task?"),
          body: cfP(mod ? L("Você não poderá voltar a este módulo.", "You will not be able to return to this module.") : L("Você não poderá voltar a esta tarefa.", "You will not be able to return to this task.")) + miss + cfP(L("O cronômetro continua correndo.", "The timer keeps running.")),
          ok: L("Encerrar", "End"), cancel: L("Continuar respondendo", "Keep answering") });
        if (!go || simA() !== A || A.si !== si0 || A.phase !== "run") break; // cancelado, ou o tempo acabou com o modal aberto (já avançou)
      }
      simFinishStep(); break; }
    case "spick": { const A = simA(); if (!A) break; const s = A.steps[A.si], m = simTest(A.test).reading[+s[1] - 1], pg = rPages(m)[A.page]; if (!pg || pg.k !== "q") break; A.ans[s].q[pg.q.n] = A.ans[s].q[pg.q.n] === +v ? undefined : +v; if (A.ans[s].q[pg.q.n] === undefined) delete A.ans[s].q[pg.q.n]; persist(); render(); break; }
    case "lpick": { const A = simA(); if (!A || A.sub !== "ans") break; const s = A.steps[A.si]; A.ans[s] = A.ans[s] || {}; A.ans[s][el.dataset.q] = +v; persist(); render(); break; }
    case "simlnext": { const A = simA(); if (!A) break; A.page++; A.sub = "play"; persist(); render(); window.scrollTo(0, 0); break; }
    case "simtr": { const A = simA(); if (!A) break; A.tr[A.steps[A.si] + ":" + A.page] = 1; A.sub = "ans"; persist(); render(); break; }
    case "sbchip": { const A = simA(); if (!A) break; const b = simTest(A.test).writing.build[A.page], pk = A.bas[b.n] = A.bas[b.n] || []; if (!pk.includes(+v) && pk.length < b.tpl.split("_____").length - 1) pk.push(+v); persist(); render(); break; }
    case "sbrem": { const A = simA(); if (!A) break; const b = simTest(A.test).writing.build[A.page]; (A.bas[b.n] || []).splice(+v, 1); persist(); render(); break; }
    case "sbclear": { const A = simA(); if (!A) break; const b = simTest(A.test).writing.build[A.page]; A.bas[b.n] = []; persist(); render(); break; }
    case "simspgo": { const A = simA(); if (!A) break; simStopAudio(); A.sub = A.sub === "dir" ? "play" : "resp"; persist(); render(); break; }
    case "simspnext": simSpNext(); break;
    case "simsave": simSave(); break;
    case "miccheck": micCheck(); break;
    case "rvorig": playOrig(v); break;
    case "rvfolder": if (has("goOpenRecFolder")) { try { await window.goOpenRecFolder(v || ""); } catch (e) { toast(errText(e)); } } else toast(L("Só no app para Windows", "Windows app only")); break;
    case "rvdel": await recDelete(el.dataset.o, el.dataset.k); break;
    case "rveval": STT = null; recEval(el.dataset.o, el.dataset.k); break;
    case "rvia": await recAI(el.dataset.o, el.dataset.k, el); break;
    case "eia": await essayAI(v, el); break;
    case "recset": P.settings.gravar = v === "on"; persist(true); render(); toast(recOn() ? L("Gravação ligada.", "Recording on.") : L("Gravação desligada.", "Recording off.")); break;
    case "aiprov": aiCfg().provider = v === "gemini" ? "gemini" : "openai"; persist(true); render(); break;
    case "aisave": { const i = $("#aikey"), k = i ? i.value.trim() : "", p = aiCfg().provider, m = $("#aimsg");
      if (!k) { toast(L("Cole a chave no campo primeiro.", "Paste the key into the field first.")); break; }
      if (!has("goAiSetKey")) { toast(L("Só no app para Windows", "Windows app only")); break; }
      try { await window.goAiSetKey(p, k); i.value = ""; i.blur(); await refreshAiCard(); toast(L("Chave salva (cifrada pelo Windows).", "Key saved (encrypted by Windows).")); }
      catch (e) { i.value = ""; if (m) m.textContent = errText(e); else toast(errText(e)); } break; }
    case "aitest": { const ai = aiCfg(), m = $("#aimsg"); if (!has("goAiTestStart")) break; el.disabled = true; if (m) m.innerHTML = `<span class="spin"></span> ${L("Testando…", "Testing…")}`;
      try { const r = await jobRun(await window.goAiTestStart(ai.provider, ai.models[ai.provider] || ""), 60000); const mm = $("#aimsg"); if (mm) mm.innerHTML = `<span class="okm">✓</span> ${L("Chave funcionando com o modelo", "Key works with model")} ${esc(r.model)}`; }
      catch (e) { const mm = $("#aimsg"); if (mm) mm.innerHTML = `<span class="warnline">${esc(errText(e))}</span>`; }
      if (document.contains(el)) el.disabled = false; break; }
    case "pkimport": await packImport(); break;
    case "pkfiles": PACK_OPEN.has(v) ? PACK_OPEN.delete(v) : PACK_OPEN.add(v); { const e = $("#pklist"); if (e) e.innerHTML = packListHTML(); } break;
    case "pkfolder": if (!has("goPackOpenFolder")) { toast(L("Só no app para Windows", "Windows app only")); break; } try { await window.goPackOpenFolder(v || ""); } catch (e) { toast(errText(e)); } break;
    case "pkopen": try { await window.goPackOpenFile(el.dataset.id, v); } catch (e) { toast(errText(e)); } break;
    case "pkdel": { const pk = (PACKS || []).find(x => x.id === v); if (!pk) break;
      if (!(await appConfirm({ title: L(`Remover o pacote "${pk.name}"?`, `Remove the pack "${pk.name}"?`), body: cfP(L(`Os arquivos do pacote são apagados de conteudo\\${pk.id}. Seu progresso, simulados feitos e gravações continuam.`, `The pack files are deleted from conteudo\\${pk.id}. Your progress, finished practice tests and recordings are kept.`)) + ((pk.type === "ets" || pk.type === "simulados") ? cfP(L("Os Simulados voltam a pedir o pacote até você importar de novo.", "Practice tests will ask for the pack again until you re-import it.")) : ""), ok: L("Remover", "Remove"), cancel: L("Cancelar", "Cancel"), danger: true }))) break;
      try { await window.goPackRemove(v); PACK_OPEN.delete(v); await loadEts(); PACKS = null; await refreshPacks(); render(); toast(L("Pacote removido.", "Pack removed.")); } catch (e) { toast(errText(e)); } break; }
    case "updcheck": await updCheck(false); break;
    case "updauto": updCfg().auto = v === "on"; persist(true); updPaint(); toast(updCfg().auto ? L("Procura automática ligada.", "Automatic check on.") : L("Procura automática desligada.", "Automatic check off.")); break;
    case "updinstall": await updInstall(); break;
    case "updrestart": await updRestart(); break;
    case "updview": go("settings"); if (!UPD.info && !UPD.checking) updCheck(true); { const c = $("#s-upd"); if (c) c.scrollIntoView({ block: "start" }); } break;
    case "updlater": { const u = updCfg(); u.ignorada = (UPD.info && UPD.info.latest) || u.disponivel; persist(true); updBar(); toast(L("Tudo bem; o aviso volta quando sair uma versão mais nova.", "OK; the notice comes back when a newer version is out.")); break; }
    case "mdl": await modelDownload(); break;
    case "aidel": { const p = aiCfg().provider;
      if (!(await appConfirm({ title: L("Remover a chave salva?", "Remove the saved key?"), body: cfP(L(`A chave da ${PROV[p]} é apagada deste computador. As avaliações já feitas continuam.`, `The ${PROV[p]} key is deleted from this computer. Gradings already done are kept.`)), ok: L("Remover", "Remove"), cancel: L("Cancelar", "Cancel"), danger: true }))) break;
      await window.goAiRemoveKey(p); await refreshAiCard(); toast(L("Chave removida.", "Key removed.")); break; }
  }
  } catch (e) { toast(L("Erro: ", "Error: ") + (e && e.message || e)); }
});
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
window.addEventListener("beforeunload", () => { if (saveTimer || simA()) persist(true); });
document.addEventListener("input", e => { if (e.target && e.target.id === "simvolr") { const v = Math.max(0, Math.min(100, +e.target.value || 0)); P.settings.volume = v / 100; if (SIM_AUDIO.el) SIM_AUDIO.el.volume = v / 100; const c = $("#volpct"); if (c) c.textContent = v + "%"; persist(); } });
document.addEventListener("change", e => { if (e.target && e.target.id === "simvolr") persist(true); });
document.addEventListener("change", e => { const el = e.target; if (!el || !el.dataset) return;
  if (el.hasAttribute("data-rvself")) { const o = recOwner(el.dataset.o), g = o && o.gravacoes && o.gravacoes[el.dataset.k]; if (!g) return; g.self = el.value; spRecalc(o); persist(true); scoreRefresh(o); }
  else if (el.hasAttribute("data-rvnote")) persist(true);
  else if (/^self-(repeat|interview|email|disc)$/.test(el.id || "")) { const A = simA(); if (A && A.phase === "done") { A.self[el.id.slice(5)] = el.value; persist(); if (el.id === "self-repeat" || el.id === "self-interview") scoreRefresh(A); } }
  else if (el.id === "aimodel") { const ai = aiCfg(); ai.models[ai.provider] = el.value.trim(); persist(true); }
});
document.addEventListener("input", e => { const el = e.target; if (!el || !el.hasAttribute || !el.hasAttribute("data-rvnote")) return; const o = recOwner(el.dataset.o), g = o && o.gravacoes && o.gravacoes[el.dataset.k]; if (g) { g.obs = el.value; persist(); } });
document.addEventListener("input", e => { // Complete the Words: grava cada lacuna; lacuna cheia pula para a próxima
  const el = e.target; if (!el.classList || !el.classList.contains("ctw")) return; const A = simA(); if (!A) return; const s = A.steps[A.si];
  A.ans[s] = A.ans[s] || { ctw: {}, q: {} }; A.ans[s].ctw = A.ans[s].ctw || {}; A.ans[s].ctw[el.dataset.ctw] = el.value; persist();
  if (el.value.length >= el.maxLength) { const all = [...document.querySelectorAll("input.ctw")], i = all.indexOf(el); if (all[i + 1]) all[i + 1].focus(); }
});
setInterval(() => { const A = simA(); if (A && A.phase === "run" && T.running() && stepTimed(A.steps[A.si])) persist(); }, 5000); // guarda o tempo restante (se o app fechar de repente, perde no máximo 5 s) // sessões em andamento ficam salvas (não fecha a rodada)

applyTheme(); // tema do sistema já antes de carregar (evita piscar)
(async function init() {
  if (!DATA) { $("#app").innerHTML = '<div class="card">Dados não encontrados.</div>'; return; }
  await Promise.all([loadP(), loadEts()]); applyTheme(); applyLang(); $("#ver").textContent = "v" + APP_VERSION; render();
  if (LOADINFO.newer) toast(L("Este progresso foi salvo por uma versão mais nova do app; nada será apagado.", "This progress was saved by a newer app version; nothing will be deleted."));
  showNews(false); updBar(); updAuto();
  if (!LOADINFO.migrated) setSaveStatus(API.native() ? L("progresso salvo localmente", "progress saved locally") : L("modo navegador (localStorage)", "browser mode (localStorage)"));
  window.__ready = true;
})();
</script>
